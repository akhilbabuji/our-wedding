<section id="events" class="section-padding bg-gradient-to-b from-blush-50/60 via-cream-100 to-sage-50/40">
  <div class="section-header">
    <h2 appReveal class="section-heading">{{ wedding.events.title }}</h2>
    <div appReveal [revealDelay]="50" class="section-accent"></div>
    <p appReveal [revealDelay]="100" class="section-subheading">
      {{ wedding.events.subtitle }}
    </p>
  </div>

  <div class="section-container mt-16 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-8">
    @for (event of visibleEvents; track event.id; let i = $index) {
      <article
        appReveal
        [revealDelay]="i * 150"
        [revealFrom]="cardRevealFrom(i)"
        class="card flex flex-col"
      >
        <div class="mb-5 flex items-center gap-3 border-b border-blush-100 pb-4">
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
            [ngClass]="{
              'bg-blush-100 text-blush-500': i === 0,
              'bg-sage-100 text-sage-600': i === 1,
              'bg-gold-300/40 text-gold-500': i === 2
            }"
          >
            {{ i + 1 }}
          </div>
          <h3 class="font-serif text-xl font-medium text-charcoal md:text-2xl">
            {{ event.title }}
          </h3>
        </div>

        <div class="space-y-3">
          <div class="event-meta-row">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon-sm mt-0.5 text-blush-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              width="16"
              height="16"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <span>{{ event.date }} · {{ event.time }}</span>
          </div>

          <div class="event-meta-row">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon-sm mt-0.5 text-sage-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              width="16"
              height="16"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>
              <strong class="block font-medium text-charcoal">{{ event.venue }}</strong>
              {{ event.address }}
            </span>
          </div>
        </div>

        <button
          type="button"
          class="btn-outline mt-6 w-full"
          (click)="openMaps(event.mapsUrl)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="icon-sm"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
          View on Google Maps
        </button>
      </article>
    }
  </div>

  <!-- RSVP CTA + scroll indicator -->
  <div class="mt-16 flex flex-col items-center gap-4">
    <a
      href="#rsvp"
      (click)="scrollToRsvp($event)"
      class="btn-primary"
    >
      RSVP Now
    </a>
    <div class="animate-bounce text-sage-400" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </div>
</section>
