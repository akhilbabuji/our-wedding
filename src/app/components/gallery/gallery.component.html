<section id="gallery" class="section-padding bg-transparent">
  <div class="section-header">
    <h2 appReveal class="section-heading">{{ wedding.gallery.title }}</h2>
    <div appReveal [revealDelay]="50" class="section-accent"></div>
    <p appReveal [revealDelay]="100" class="section-subheading">
      {{ wedding.gallery.subtitle }}
    </p>
  </div>

  <div appReveal [revealDelay]="150" class="section-container mt-16">
    <div class="relative mx-auto max-w-2xl select-none">

      <!-- Photo frame -->
      <div
        class="relative overflow-hidden rounded-2xl shadow-2xl aspect-[4/3] cursor-zoom-in"
        role="button"
        tabindex="0"
        aria-label="Open photo"
        (click)="openLightbox()"
        (keydown.enter)="openLightbox()"
        (keydown.space)="$event.preventDefault(); openLightbox()"
      >

        <!-- Slides -->
        @for (image of images; track image.id; let i = $index) {
          <img
            [src]="image.src"
            [alt]="image.alt"
            class="absolute inset-0 h-full w-full object-cover transition-opacity duration-500"
            [class.opacity-100]="current() === i"
            [class.opacity-0]="current() !== i"
          />
        }

        <!-- Prev arrow -->
        <button
          type="button"
          (click)="onPrev(); $event.stopPropagation()"
          aria-label="Previous photo"
          class="absolute left-3 top-1/2 -translate-y-1/2 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/40 focus:outline-none cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <!-- Next arrow -->
        <button
          type="button"
          (click)="onNext(); $event.stopPropagation()"
          aria-label="Next photo"
          class="absolute right-3 top-1/2 -translate-y-1/2 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/40 focus:outline-none cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <app-lightbox
        [images]="images"
        (closed)="onLightboxClosed()"
      />

      <!-- Dot indicators -->
      <div class="mt-5 flex items-center justify-center gap-2.5">
        @for (image of images; track image.id; let i = $index) {
          <button
            type="button"
            (click)="onDot(i)"
            [attr.aria-label]="'Go to photo ' + (i + 1)"
            class="rounded-full transition-all duration-300 focus:outline-none"
            [class.w-6]="current() === i"
            [class.w-2]="current() !== i"
            [class.h-2]="true"
            [class.bg-sage-600]="current() === i"
            [class.bg-charcoal]="current() !== i"
            [class.opacity-30]="current() !== i"
          ></button>
        }
      </div>

      <!-- Counter + download actions -->
      <div class="mt-4 flex flex-col items-center gap-3 sm:flex-row sm:justify-center sm:gap-5">
        <p class="text-xs tracking-widest text-charcoal-light">
          {{ current() + 1 }} / {{ images.length }}
        </p>

        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="downloadCurrent()"
            class="inline-flex items-center gap-1.5 rounded-full border border-sage-500/40 bg-cream-50/80 px-3.5 py-1.5 text-[11px] font-medium tracking-wider uppercase text-sage-700 transition hover:border-sage-600 hover:bg-sage-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-sage-300"
            aria-label="Download original version of this photo"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/>
            </svg>
            Download original
          </button>

          <button
            type="button"
            (click)="downloadAll()"
            [disabled]="downloading()"
            class="inline-flex items-center gap-1.5 rounded-full border border-blush-300/50 bg-cream-50/80 px-3.5 py-1.5 text-[11px] font-medium tracking-wider uppercase text-blush-600 transition hover:border-blush-400 hover:bg-blush-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blush-200 disabled:cursor-wait disabled:opacity-50"
            aria-label="Download all gallery photos in original quality"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/>
            </svg>
            {{ downloading() ? 'Downloading…' : 'Download all originals' }}
          </button>
        </div>
      </div>

    </div>
  </div>
</section>
