<section id="gallery" class="section-padding bg-transparent">
  <div class="section-header">
    <h2 appReveal class="section-heading">{{ wedding.gallery.title }}</h2>
    <div appReveal [revealDelay]="50" class="section-accent"></div>
    <p appReveal [revealDelay]="100" class="section-subheading">
      {{ wedding.gallery.subtitle }}
    </p>
  </div>

  <div appReveal [revealDelay]="150" class="section-container mt-16">
    <div class="relative mx-auto max-w-2xl select-none">

      <!-- Photo frame -->
      <div class="relative overflow-hidden rounded-2xl shadow-2xl aspect-[4/3]">

        <!-- Slides -->
        @for (image of images; track image.id; let i = $index) {
          <img
            [src]="image.src"
            [alt]="image.alt"
            class="absolute inset-0 h-full w-full object-cover transition-opacity duration-500"
            [class.opacity-100]="current() === i"
            [class.opacity-0]="current() !== i"
          />
        }

        <!-- Prev arrow -->
        <button
          type="button"
          (click)="onPrev()"
          aria-label="Previous photo"
          class="absolute left-3 top-1/2 -translate-y-1/2 flex h-10 w-10 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/40 focus:outline-none"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <!-- Next arrow -->
        <button
          type="button"
          (click)="onNext()"
          aria-label="Next photo"
          class="absolute right-3 top-1/2 -translate-y-1/2 flex h-10 w-10 items-center justify-center rounded-full bg-white/20 text-white backdrop-blur-sm transition hover:bg-white/40 focus:outline-none"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- Dot indicators -->
      <div class="mt-5 flex items-center justify-center gap-2.5">
        @for (image of images; track image.id; let i = $index) {
          <button
            type="button"
            (click)="onDot(i)"
            [attr.aria-label]="'Go to photo ' + (i + 1)"
            class="rounded-full transition-all duration-300 focus:outline-none"
            [class.w-6]="current() === i"
            [class.w-2]="current() !== i"
            [class.h-2]="true"
            [class.bg-sage-600]="current() === i"
            [class.bg-charcoal]="current() !== i"
            [class.opacity-30]="current() !== i"
          ></button>
        }
      </div>

      <!-- Counter -->
      <p class="mt-3 text-center text-xs tracking-widest text-charcoal-light">
        {{ current() + 1 }} / {{ images.length }}
      </p>

    </div>
  </div>
</section>
