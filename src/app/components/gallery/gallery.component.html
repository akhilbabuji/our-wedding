<section id="gallery" class="section-padding bg-cream-50">
  <div class="mx-auto max-w-3xl text-center">
    <h2 appReveal class="section-heading">{{ wedding.gallery.title }}</h2>
    <p appReveal [revealDelay]="100" class="section-subheading mx-auto">
      {{ wedding.gallery.subtitle }}
    </p>
  </div>

  <div
    class="mx-auto mt-16 grid max-w-6xl grid-cols-2 gap-3 md:grid-cols-3 md:gap-4"
  >
    @for (image of wedding.gallery.images; track image.id; let i = $index) {
      <button
        type="button"
        appReveal
        [revealDelay]="i * 80"
        class="group relative aspect-square overflow-hidden rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-400 focus:ring-offset-2"
        (click)="openLightbox(i)"
        [attr.aria-label]="'View photo: ' + image.alt"
      >
        <img
          [src]="image.src"
          [alt]="image.alt"
          loading="lazy"
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        />
        <div
          class="absolute inset-0 flex items-end bg-gradient-to-t from-charcoal/60 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
        >
          @if (image.caption) {
            <p class="p-4 text-left text-xs text-cream-50">
              {{ image.caption }}
            </p>
          }
        </div>
      </button>
    }
  </div>

  <app-lightbox [images]="wedding.gallery.images" />
</section>
