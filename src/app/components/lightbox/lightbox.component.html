@if (isOpen() && currentImage) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-charcoal/90 backdrop-blur-sm animate-fade-in"
    role="dialog"
    aria-modal="true"
    aria-label="Image gallery lightbox"
    (click)="close()"
  >
    <button
      type="button"
      class="absolute top-4 right-4 z-10 flex h-10 w-10 items-center justify-center rounded-full text-cream-50 transition-colors hover:bg-white/10 sm:top-5 sm:right-5"
      aria-label="Close lightbox"
      (click)="close(); $event.stopPropagation()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="icon-md"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>

    <button
      type="button"
      class="absolute left-3 z-10 flex h-10 w-10 items-center justify-center rounded-full text-cream-50 transition-colors hover:bg-white/10 sm:left-6 md:left-8"
      aria-label="Previous image"
      (click)="prev(); $event.stopPropagation()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="icon-md"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>

    <div
      class="mx-14 max-h-[85vh] max-w-5xl animate-scale-in sm:mx-16"
      (click)="$event.stopPropagation()"
    >
      <img
        [src]="imageSrc(currentImage)"
        [alt]="currentImage.alt"
        class="max-h-[80vh] w-full rounded-lg object-contain shadow-2xl"
      />
      @if (currentImage.caption) {
        <p class="mt-4 text-center text-sm tracking-wide text-blush-100">
          {{ currentImage.caption }}
        </p>
      }
      <p class="mt-2 text-center text-xs text-cream-50/50">
        {{ currentIndex() + 1 }} / {{ images.length }}
      </p>
    </div>

    <button
      type="button"
      class="absolute right-3 z-10 flex h-10 w-10 items-center justify-center rounded-full text-cream-50 transition-colors hover:bg-white/10 sm:right-6 md:right-8"
      aria-label="Next image"
      (click)="next(); $event.stopPropagation()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="icon-md"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        width="20"
        height="20"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M9 5l7 7-7 7"
        />
      </svg>
    </button>
  </div>
}
