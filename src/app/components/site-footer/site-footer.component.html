<footer class="bg-sage-700 px-5 py-12 text-center text-cream-100">
  <p class="font-serif text-xl italic">{{ wedding.footer.message }}</p>
  <p class="mt-3 text-sm tracking-[0.2em] uppercase text-cream-200/70">
    {{ wedding.couple.displayNames }}
  </p>
  <p class="mt-4 text-xs tracking-widest text-sage-400">
    {{ wedding.footer.hashtag }}
  </p>
  <p class="mt-8 text-xs text-cream-200/40">
    &copy; {{ year }} {{ wedding.couple.displayNames }}. Made with love.
  </p>
</footer>
