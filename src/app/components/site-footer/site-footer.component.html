<footer class="bg-gradient-to-r from-sage-700 via-sage-600 to-sage-700 px-5 py-12 text-center text-cream-100">
  <p class="font-serif text-xl italic text-blush-100">{{ wedding.footer.message }}</p>
  <p class="mt-3 text-sm tracking-[0.2em] uppercase text-cream-200/80">
    <span class="text-blush-300">♥</span>
    {{ wedding.couple.displayNames }}
    <span class="text-blush-300">♥</span>
  </p>
  <div class="mx-auto mt-4 h-px w-12 bg-gold-400/50"></div>
  <p class="mt-4 text-xs tracking-widest text-gold-300">
    {{ wedding.footer.hashtag }}
  </p>
  <p class="mt-8 text-xs text-cream-200/40">
    &copy; {{ year }} {{ wedding.couple.displayNames }}. Made with love.
  </p>
</footer>
