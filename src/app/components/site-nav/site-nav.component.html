<nav
  class="fixed top-0 right-0 left-0 z-40 border-b border-cream-200/50 bg-cream-50/80 backdrop-blur-md"
>
  <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 md:px-8">
    <a
      href="#"
      class="font-serif text-lg font-medium tracking-wide text-charcoal md:text-xl"
    >
      {{ wedding.couple.displayNames }}
    </a>

    <!-- Desktop nav -->
    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.href) {
        <li>
          <a
            [href]="link.href"
            class="text-xs font-medium tracking-[0.15em] uppercase text-charcoal-light transition-colors hover:text-sage-600"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Mobile menu button -->
    <button
      type="button"
      class="rounded-lg p-2 text-charcoal md:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
    >
      @if (isMenuOpen) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile menu -->
  @if (isMenuOpen) {
    <div
      class="border-t border-cream-200 bg-cream-50/95 px-5 py-4 backdrop-blur-md md:hidden animate-fade-in"
    >
      <ul class="space-y-4">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="block text-sm font-medium tracking-[0.15em] uppercase text-charcoal-light transition-colors hover:text-sage-600"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
