<section id="story" class="section-padding bg-cream-50">
  <div class="mx-auto max-w-3xl text-center">
    <h2 appReveal class="section-heading">{{ wedding.story.title }}</h2>
    <p appReveal [revealDelay]="100" class="section-subheading mx-auto">
      {{ wedding.story.subtitle }}
    </p>
  </div>

  <div class="relative mx-auto mt-16 max-w-2xl">
    <!-- Vertical line -->
    <div
      class="absolute top-0 bottom-0 left-6 w-px bg-gradient-to-b from-blush-300 via-sage-400 to-blush-300 md:left-1/2 md:-translate-x-px"
      aria-hidden="true"
    ></div>

    @for (milestone of wedding.story.milestones; track milestone.id; let i = $index) {
      <div
        appReveal
        [revealDelay]="i * 100"
        class="relative mb-12 flex items-start gap-6 md:mb-16"
        [class.md:flex-row-reverse]="i % 2 !== 0"
      >
        <!-- Dot -->
        <div
          class="relative z-10 flex h-12 w-12 shrink-0 items-center justify-center rounded-full border-2 border-sage-500 bg-cream-50 md:absolute md:left-1/2 md:-translate-x-1/2"
        >
          <div class="h-3 w-3 rounded-full bg-sage-500"></div>
        </div>

        <!-- Content card -->
        <div
          class="card flex-1 md:w-[calc(50%-2.5rem)]"
          [class.md:mr-auto]="i % 2 === 0"
          [class.md:ml-auto]="i % 2 !== 0"
          [class.md:pr-12]="i % 2 === 0"
          [class.md:pl-12]="i % 2 !== 0"
        >
          <time
            class="text-xs font-medium tracking-[0.2em] uppercase text-sage-500"
          >
            {{ milestone.date }}
          </time>
          <h3 class="mt-2 font-serif text-2xl font-medium text-charcoal">
            {{ milestone.title }}
          </h3>
          <p class="mt-3 text-sm leading-relaxed text-charcoal-light md:text-base">
            {{ milestone.description }}
          </p>
        </div>
      </div>
    }
  </div>
</section>
